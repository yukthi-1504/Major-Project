apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flashsale-app-hpa
  namespace: default
  labels:
    app: flashsale-app
    project: major-project-reva

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flashsale-app

  # Scale between 1 and 5 replicas (matches ML model's replica tiers)
  minReplicas: 1
  maxReplicas: 5

  metrics:
    # Scale on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # scale up when avg CPU > 70%

    # Scale on Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80   # scale up when avg Memory > 80%

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # wait 60s before scaling up again
      policies:
        - type: Pods
          value: 2                     # add at most 2 pods at a time
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # wait 5 min before scaling down (avoid flapping)
      policies:
        - type: Pods
          value: 1                     # remove 1 pod at a time
          periodSeconds: 120

# -------------------------------------------------------------------
# Usage:
#   kubectl apply -f k8s/hpa.yaml
#   kubectl get hpa
#   kubectl describe hpa flashsale-app-hpa
#
# Prerequisites:
#   Metrics Server must be installed:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# -------------------------------------------------------------------
